name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # ID842 crbundle.v1 parity vendored-sync reads the sibling app fixture and must
    # NOT skip when the checkout is missing (ID825). Point the test at the workspace clone.
    env:
      CODERIFTS_APP_DIR: ${{ github.workspace }}/coderifts-app
    steps:
      - uses: actions/checkout@v4

      # coderifts/app is PRIVATE. GITHUB_TOKEN cannot read it from this public repo.
      # APP_REPO_READ_TOKEN: PAT (or fine-grained token) with contents:read on coderifts/app.
      # Fail loud if the secret/checkout is missing — same spirit as the app CI website checkout.
      # Sparse: the parity test only needs test/fixtures/crbundle-v1-parity.frozen.json.
      - name: Checkout app (crbundle.v1 parity fixture)
        uses: actions/checkout@v4
        with:
          repository: coderifts/app
          path: coderifts-app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            test/fixtures/crbundle-v1-parity.frozen.json
          sparse-checkout-cone-mode: false

      - name: Require app parity fixture
        run: |
          set -euo pipefail
          f="${CODERIFTS_APP_DIR}/test/fixtures/crbundle-v1-parity.frozen.json"
          if [ ! -f "$f" ]; then
            echo "::error::coderifts/app checkout is missing ${f} (crbundle.v1 parity vendored-sync)."
            echo "::error::Add APP_REPO_READ_TOKEN (contents:read on coderifts/app) to this repo's Actions secrets."
            exit 1
          fi
          echo "parity fixture: ${f}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci requires the committed package-lock.json (it resolves @coderifts/sdk@1.1.1 from the
      # public npm registry with an integrity hash — reproducible).
      - name: Install
        run: npm ci

      # Separate steps so a failure is visibly its own red step (lint, build, and test each gate).
      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build (dual CJS/ESM + dist type markers)
        run: npm run build

      - name: Test (node --test)
        run: npm test
